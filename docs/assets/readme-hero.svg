<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">AAJ Contact Scan</title><desc id="desc">A red and ivory product banner showing a business card becoming a checked contact record.</desc>
